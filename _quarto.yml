#  image: images/logos/logo.png
  favicon: images/logos/logo.png
  cookie-consent: false
  google-analytics: ''
  page-navigation: true
  search: true
  sidebar:
    title: ''
    logo: ''
    search: true
    contents: ''
    style: floating
    background: light
    foreground: dark
    border: true
    alignment: left
    collapse-level: 1
    pinned: true
    header: ''
    footer: ''
  margin-header: ''
  page-footer: CC-BY (2024) Philip Leftwich
  chapters:
  - index.qmd
  - part: "RStudio"
    chapters:
    - 01-studio-basics.qmd
  - part: "Project & Data Management"
    chapters:
#   - spreadsheets.qmd
    - tidy-data.qmd
    - projects.qmd
    - import_penguins_data.qmd
    - import_data.qmd
#   - data dictionaries.qmd
    - summarise.qmd
  - part: "Dplyr"
    chapters:
    - 05-dplyr.qmd
  - part: "Data Cleaning"
    chapters:
    - columns.qmd
    - strings.qmd
    - duplicates.qmd
    - dates.qmd
    - factors.qmd
    - Summary.qmd
  - part: "Data Validation"
    chapters:
    - 11-assertions.qmd
    - 12-data-checking-functions.qmd
  - part: "Data Visualisation"
    chapters:
    - ggplot.qmd
    - ggplot2.qmd
    - ggplot3.qmd
  appendices:
  - r-basics.qmd
  - references.qmd
bibliography:
  - include/packages.bib
  - include/references.bib
csl: include/apa.csl
format:
  html:
    theme:
      light:
      - flatly
      - include/light.scss
      dark:
      - darkly
      - include/dark.scss
    css:
    - https://use.fontawesome.com/releases/v5.13.0/css/all.css
    - include/booktem.css
    - include/webex.css
    - include/glossary.css
    - include/style.css
    df-print: kable
    code-link: true
    code-fold: false
    code-line-numbers: true
    code-overflow: scroll
    code-copy: hover
    highlight-style: a11y
    mainfont: ''
    monofont: ''
    include-after-body:
    - include/webex.js
    - include/script.js
